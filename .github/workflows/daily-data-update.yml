name: Daily tennis data update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-data-update.yml"
      - "scripts/*.py"
      - "tests/*.py"
  schedule:
    # 13:47 India Standard Time; avoid the busiest top-of-hour schedule slot.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Check this many recent days for missing settled matches"
        required: true
        default: 30
        type: number

permissions:
  contents: write

concurrency:
  group: daily-tennis-data-update
  cancel-in-progress: false

jobs:
  update-recent-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild local archive database from tracked source CSVs
        run: python scripts/build_dataset.py

      - name: Check temporal history and incremental replay
        run: python -m unittest discover -s tests -v

      - name: Find and append missing recent matches
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 30 }}
        run: python scripts/update_recent_odds.py --lookback-days "$LOOKBACK_DAYS"

      - name: Append verified post-archive model features
        run: python scripts/build_recent_odds_features.py

      - name: Append available pre-match rankings for recent matches
        run: python scripts/build_recent_ranking_fallbacks.py

      - name: Append recent player profile context
        run: python scripts/build_recent_player_profiles.py

      - name: Append and verify recent odds corrections
        run: |
          python scripts/correct_recent_odds.py
          python scripts/correct_recent_odds.py --verify-only

      - name: Reconstruct current recent features with corrected history and identities
        run: python scripts/build_current_recent_snapshot.py

      - name: Build joined recent feature exports by competition level
        run: python scripts/build_recent_features_enriched.py

      - name: Verify odds export and manifest
        run: python scripts/verify_odds_export.py

      - name: Verify recent model supplements and temporal boundaries
        run: python scripts/verify_recent_supplements.py

      - name: Append and validate unified post-2000 results
        run: |
          python scripts/build_curated_dataset.py
          python scripts/verify_curated_dataset.py

      - name: Append ATP/WTA main-tour pre-match features
        run: python scripts/build_main_tour_dataset.py

      - name: Build current ATP/WTA research release with explicit draw scope
        run: python scripts/build_research_release.py

      - name: Audit ATP/WTA main-tour coverage and quality
        run: python scripts/audit_atp_wta_main_tour.py

      - name: Append licensed ATP/WTA match charting statistics
        run: python scripts/update_match_charting_project.py

      - name: Append licensed Grand Slam point-by-point summaries and audited crosswalks
        run: python scripts/update_point_by_point_supplement.py

      - name: Append player-oriented opening and last-pre-match odds quotes
        run: python scripts/build_odds_quote_table.py

      - name: Build separate prior-only point-history sensitivity features
        run: python scripts/build_point_history_experiment.py

      - name: Refresh multidimensional coverage and missingness report
        run: python scripts/build_coverage_dashboard.py

      - name: Audit actual release rows and fail on integrity defects
        run: python scripts/audit_repository_quality.py

      - name: Check data contracts, timing and append-only identity rules
        run: python -m unittest discover -s tests -v

      - name: Verify existing dataset bytes were preserved
        run: python scripts/verify_daily_append_only.py

      - name: Commit only when tracked data changed
        shell: bash
        run: |
          paths=(
            data/odds/atp_wta_match_odds.csv data/odds/valuebetennis_manifest.json
            data/odds/recent_model_features.csv.gz data/odds/recent_model_features_report.json
            data/odds/recent_ranking_fallbacks.csv.gz data/odds/recent_ranking_fallbacks_report.json
            data/odds/recent_player_profiles.csv.gz data/odds/recent_player_profiles_report.json
            data/odds/recent_odds_corrections.csv data/odds/recent_odds_corrections_report.json
            data/odds/recent_model_features_enriched.csv.gz data/odds/recent_main_tour_event_features.csv.gz
            data/odds/recent_lower_tier_event_features.csv.gz data/odds/recent_features_enrichment_report.json
            data/odds/current data/odds/quotes data/curated/post_2000 data/curated/main_tour
            data/curated/research_release data/curated/match_charting data/curated/point_by_point
            data/experimental/point_history data/quality docs/coverage-dashboard.md docs/repository-quality.md
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${paths[@]}"
          git commit -m "Append source data and refresh audited research views"
          git push
