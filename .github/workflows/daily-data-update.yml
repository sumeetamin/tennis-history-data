name: Daily tennis data update

on:
  schedule:
    # 13:47 India Standard Time; avoid the busiest top-of-hour schedule slot.
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Check this many recent days for missing settled matches"
        required: true
        default: 30
        type: number

permissions:
  contents: write

concurrency:
  group: daily-tennis-data-update
  cancel-in-progress: false

jobs:
  update-recent-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild local archive database from tracked source CSVs
        run: python scripts/build_dataset.py

      - name: Check temporal history and incremental replay
        run: python -m unittest discover -s tests -v

      - name: Find and append missing recent matches
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 30 }}
        run: python scripts/update_recent_odds.py --lookback-days "$LOOKBACK_DAYS"

      - name: Append verified post-archive model features
        run: python scripts/build_recent_odds_features.py

      - name: Append available pre-match rankings for recent matches
        run: python scripts/build_recent_ranking_fallbacks.py

      - name: Append recent player profile context
        run: python scripts/build_recent_player_profiles.py

      - name: Append and verify recent odds corrections
        run: |
          python scripts/correct_recent_odds.py
          python scripts/correct_recent_odds.py --verify-only

      - name: Verify odds export and manifest
        run: python scripts/verify_odds_export.py

      - name: Verify recent model supplements and temporal boundaries
        run: python scripts/verify_recent_supplements.py

      - name: Append and validate unified post-2000 results
        run: |
          python scripts/build_curated_dataset.py
          python scripts/verify_curated_dataset.py

      - name: Verify existing dataset bytes were preserved
        run: python scripts/verify_daily_append_only.py

      - name: Commit only when new matches were added
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/odds/atp_wta_match_odds.csv data/odds/recent_model_features.csv.gz data/odds/recent_ranking_fallbacks.csv.gz data/odds/recent_player_profiles.csv.gz data/odds/recent_odds_corrections.csv data/curated/post_2000/matches data/curated/post_2000/players.csv.gz data/curated/post_2000/player_identity_candidates.csv.gz)" ]; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds/atp_wta_match_odds.csv data/odds/valuebetennis_manifest.json data/odds/recent_model_features.csv.gz data/odds/recent_model_features_report.json data/odds/recent_ranking_fallbacks.csv.gz data/odds/recent_ranking_fallbacks_report.json data/odds/recent_player_profiles.csv.gz data/odds/recent_player_profiles_report.json data/odds/recent_odds_corrections.csv data/odds/recent_odds_corrections_report.json data/curated/post_2000
          git commit -m "Append recent tennis results, odds and verified features"
          git push
